name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Validate notebook JSON and Python syntax
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          notebooks = sorted(Path('.').glob('*.ipynb'))
          if not notebooks:
              raise SystemExit('No notebooks found')

          checked = 0
          for path in notebooks:
              data = json.loads(path.read_text(encoding='utf-8'))
              if data.get('nbformat', 0) < 4:
                  raise SystemExit(f'{path}: unsupported notebook format')
              for index, cell in enumerate(data.get('cells', []), start=1):
                  if cell.get('cell_type') != 'code':
                      continue
                  source = ''.join(cell.get('source', []))
                  # IPython magics/shell escapes are valid notebook syntax but not Python AST.
                  python_lines = [
                      line for line in source.splitlines()
                      if not line.lstrip().startswith(('%', '!', '?'))
                  ]
                  try:
                      ast.parse('\n'.join(python_lines), filename=f'{path}:cell-{index}')
                  except SyntaxError as exc:
                      raise SystemExit(f'{path}: code cell {index}: {exc}') from exc
                  checked += 1
          print(f'Validated {len(notebooks)} notebook(s), {checked} code cell(s)')
          PY

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@v20
        with:
          globs: "**/*.md"
